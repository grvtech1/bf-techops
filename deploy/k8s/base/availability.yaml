apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: merchant-api
  namespace: merchant-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: merchant-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: merchant-worker
  namespace: merchant-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: merchant-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: merchant-portal
  namespace: merchant-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: merchant-portal
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: merchant-api
  namespace: merchant-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: merchant-api }
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }

