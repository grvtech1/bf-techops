apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: merchant-platform
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: merchant-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: merchant-platform
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: merchant-platform
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: merchant-platform
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
          envFrom:
            - secretRef: { name: local-database }
          ports:
            - { name: mysql, containerPort: 3306 }
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: merchant-platform
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: merchant-platform
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: merchant-platform
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: merchant-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: merchant-platform
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: { sizeLimit: 512Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
