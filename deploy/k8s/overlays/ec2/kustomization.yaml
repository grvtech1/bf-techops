apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ec2 overlay — self-managed kubeadm cluster on EC2.
# local overlay jaisa (in-cluster MySQL + Redis), par images ECR se
# (kind ka "local image load" EC2 pe kaam nahi karta).

resources:
  - ../../base                 # namespace, SAs, config, deployments, services, migrate Job
  - dependencies.yaml # in-cluster MySQL StatefulSet + Redis (RDS nahi)

# Secrets — local overlay se copy (in-cluster DB/Redis ke liye)
secretGenerator:
  - name: local-database
    namespace: merchant-platform
    literals:
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_ROOT_PASSWORD=local-root-password
  - name: merchant-api-runtime
    namespace: merchant-platform
    literals:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_SSL=false
      - PLATFORM_API_KEY=local-platform-api-key-change-me
      - ACTOR_TOKEN_SECRET=local-actor-token-secret-change-me-32-chars
      - PAYMENT_PROVIDER=sandboxpay
      - PAYMENT_WEBHOOK_SECRET=local-payment-webhook-secret-change-me-32-chars
      - PAYMENT_WEBHOOK_TOLERANCE_SECONDS=300
  - name: merchant-worker-runtime
    namespace: merchant-platform
    literals:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS=false
  - name: merchant-portal-runtime
    namespace: merchant-platform
    literals:
      - PLATFORM_API_KEY=local-platform-api-key-change-me
      - ALERT_WEBHOOK_TOKEN=local-alert-webhook-token-change-me
  - name: merchant-migration-runtime
    namespace: merchant-platform
    literals:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_SSL=false

generatorOptions:
  disableNameSuffixHash: true   # secret naam stable rahe (deployments secretRef match)

# Images → ECR. Base pehle merchant-*-image ko merchant-platform-* karta,
# yahan un final naamo ko ECR URI pe point karte.
# newName = ECR host (account.dkr.ecr.region.amazonaws.com) — apna account ho to badlo.
images:
  - name: merchant-platform-api
    newName: 336129194698.dkr.ecr.ap-south-1.amazonaws.com/bf-techops/api
    newTag: v1
  - name: merchant-platform-worker
    newName: 336129194698.dkr.ecr.ap-south-1.amazonaws.com/bf-techops/worker
    newTag: v1
  - name: merchant-platform-portal
    newName: 336129194698.dkr.ecr.ap-south-1.amazonaws.com/bf-techops/portal
    newTag: v1
  - name: merchant-platform-migration
    newName: 336129194698.dkr.ecr.ap-south-1.amazonaws.com/bf-techops/migration
    newTag: v1

# ServiceAccounts pe imagePullSecret — ArgoCD-deployed pods bhi ECR se pull
# kar sakein (ecr-creds secret cluster me manually banta — token 12h expire).
patches:
  - target:
      kind: ServiceAccount
      name: "merchant-.*"
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: ecr-creds

# GitOps demo: portal replicas 2 → 3. Ye Git change push karo → ArgoCD
# KHUD 3rd pod banayega (bina kubectl)। Yehi GitOps loop ka proof.
replicas:
  - name: merchant-portal
    count: 3
