apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - dependencies.yaml
  - seed-job.yaml
secretGenerator:
  - name: local-database
    namespace: merchant-platform
    literals:
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_ROOT_PASSWORD=local-root-password
  - name: merchant-api-runtime
    namespace: merchant-platform
    literals:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_SSL=false
      - PLATFORM_API_KEY=local-platform-api-key-change-me
      - ACTOR_TOKEN_SECRET=local-actor-token-secret-change-me-32-chars
      - PAYMENT_PROVIDER=sandboxpay
      - PAYMENT_WEBHOOK_SECRET=local-payment-webhook-secret-change-me-32-chars
      - PAYMENT_WEBHOOK_TOLERANCE_SECONDS=300
  - name: merchant-worker-runtime
    namespace: merchant-platform
    literals:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TLS=false
  - name: merchant-portal-runtime
    namespace: merchant-platform
    literals:
      - PLATFORM_API_KEY=local-platform-api-key-change-me
      - ALERT_WEBHOOK_TOKEN=local-alert-webhook-token-change-me
  - name: alertmanager-routing
    namespace: merchant-platform
    literals:
      - token=local-alert-webhook-token-change-me
  - name: merchant-migration-runtime
    namespace: merchant-platform
    literals:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=merchant_platform
      - MYSQL_USER=merchant_app
      - MYSQL_PASSWORD=local-only-password
      - MYSQL_SSL=false
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
images:
  - name: merchant-api-image
    newName: merchant-platform-api
    newTag: local
  - name: merchant-worker-image
    newName: merchant-platform-worker
    newTag: local
  - name: merchant-portal-image
    newName: merchant-platform-portal
    newTag: local
  - name: merchant-migration-image
    newName: merchant-platform-migration
    newTag: local
  - name: merchant-seed-image
    newName: merchant-platform-seed
    newTag: local
