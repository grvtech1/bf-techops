apiVersion: batch/v1
kind: Job
metadata:
  name: merchant-platform-seed
  namespace: merchant-platform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: merchant-platform-seed
        app.kubernetes.io/part-of: merchant-platform
    spec:
      restartPolicy: Never
      serviceAccountName: merchant-migration
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: merchant-seed-image
          env:
            - { name: NODE_ENV, value: development }
          envFrom:
            - secretRef: { name: merchant-migration-runtime }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: { drop: ["ALL"] }

