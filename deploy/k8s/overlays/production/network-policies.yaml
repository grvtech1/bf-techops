apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: merchant-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: merchant-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-api
  namespace: merchant-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: merchant-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - ipBlock: { cidr: REPLACE_VPC_CIDR }
      ports:
        - { protocol: TCP, port: 3306 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-worker
  namespace: merchant-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: merchant-worker }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 9091 }
  egress:
    - to:
        - ipBlock: { cidr: REPLACE_VPC_CIDR }
      ports:
        - { protocol: TCP, port: 3306 }
        - { protocol: TCP, port: 6379 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [REPLACE_VPC_CIDR]
      ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-portal
  namespace: merchant-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: merchant-portal }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: merchant-api }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-migration
  namespace: merchant-platform
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: merchant-platform-migrate }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: REPLACE_VPC_CIDR }
      ports:
        - { protocol: TCP, port: 3306 }
