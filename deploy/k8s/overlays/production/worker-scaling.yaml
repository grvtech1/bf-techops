apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: merchant-worker
  namespace: merchant-platform
spec:
  scaleTargetRef:
    name: merchant-worker
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
        metricName: merchant_platform_notification_queue_waiting
        query: max(merchant_platform_notification_queue_waiting)
        threshold: "25"
