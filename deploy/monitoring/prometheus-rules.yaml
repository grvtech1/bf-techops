apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: merchant-platform
  namespace: merchant-platform
  labels:
    app.kubernetes.io/part-of: merchant-platform
spec:
  groups:
    - name: merchant-platform.slo
      rules:
        - alert: MerchantPlatformApiHighErrorRate
          expr: |
            sum(rate(merchant_platform_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(merchant_platform_http_requests_total[5m])), 0.001) > 0.05
            and sum(rate(merchant_platform_http_requests_total[5m])) > 0.1
          for: 5m
          labels: { severity: critical, service: merchant-api }
          annotations:
            summary: Merchant API 5xx rate exceeds 5 percent
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/api-high-error-rate.md
        - alert: MerchantPlatformApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(merchant_platform_http_request_duration_seconds_bucket[5m]))) > 0.75
          for: 10m
          labels: { severity: warning, service: merchant-api }
          annotations:
            summary: Merchant API p95 latency exceeds 750 ms
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/api-high-latency.md
        - alert: MerchantPlatformPaymentWebhookRejected
          expr: |
            sum(increase(merchant_platform_payment_webhooks_total{outcome=~"signature_rejected|rejected|invalid_event_time"}[10m])) > 5
          for: 5m
          labels: { severity: warning, service: merchant-api }
          annotations:
            summary: Payment callbacks are being rejected repeatedly
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/payment-webhook-rejections.md
        - alert: MerchantPlatformOutboxBacklogOld
          expr: max(merchant_platform_outbox_oldest_pending_age_seconds) > 120
          for: 5m
          labels: { severity: critical, service: merchant-worker }
          annotations:
            summary: Oldest unpublished invoice event exceeds two minutes
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/outbox-backlog.md
        - alert: MerchantPlatformQueueBacklogHigh
          expr: max(merchant_platform_notification_queue_waiting) > 100
          for: 10m
          labels: { severity: warning, service: merchant-worker }
          annotations:
            summary: Notification queue has more than 100 waiting jobs
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/outbox-backlog.md
        - alert: MerchantPlatformDeadLetterCreated
          expr: increase(merchant_platform_notification_deliveries_total{outcome="dead_lettered"}[10m]) > 0
          labels: { severity: critical, service: merchant-worker }
          annotations:
            summary: A notification exhausted its retries
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/dead-letter.md
        - alert: MerchantPlatformApiUnavailable
          expr: sum(up{namespace="merchant-platform",service="merchant-api"}) < 1
          for: 2m
          labels: { severity: critical, service: merchant-api }
          annotations:
            summary: No Merchant API metrics target is reachable
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/api-unavailable.md
        - alert: MerchantPlatformDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="merchant-platform"} < kube_deployment_spec_replicas{namespace="merchant-platform"}
          for: 10m
          labels: { severity: warning, service: kubernetes }
          annotations:
            summary: Merchant platform deployment has unavailable replicas
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/rollout-failure.md
        - alert: MerchantPlatformWorkerMetricsUnavailable
          expr: sum(up{namespace="merchant-platform",service="merchant-worker-metrics"}) < 1
          for: 2m
          labels: { severity: critical, service: merchant-worker }
          annotations:
            summary: No Merchant worker metrics target is reachable
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/api-unavailable.md
        - alert: MerchantPlatformContainerRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="merchant-platform"}[10m]) > 2
          for: 2m
          labels: { severity: warning, service: kubernetes }
          annotations:
            summary: A Merchant Platform container restarted repeatedly
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/pod-instability.md
        - alert: MerchantPlatformContainerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="merchant-platform"}[10m]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{namespace="merchant-platform",reason="OOMKilled"} == 1
          labels: { severity: critical, service: kubernetes }
          annotations:
            summary: A Merchant Platform container was OOMKilled
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/pod-instability.md
        - alert: MerchantPlatformAutoscalerAtMaximum
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="merchant-platform"}
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="merchant-platform"}
          for: 15m
          labels: { severity: warning, service: autoscaling }
          annotations:
            summary: A Merchant Platform autoscaler has remained at maximum replicas
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/autoscaling-saturation.md
        - alert: MerchantPlatformMonitoringVolumeLow
          expr: |
            kubelet_volume_stats_available_bytes{namespace="monitoring"}
            / clamp_min(kubelet_volume_stats_capacity_bytes{namespace="monitoring"}, 1) < 0.15
          for: 15m
          labels: { severity: warning, service: monitoring }
          annotations:
            summary: A monitoring persistent volume has less than 15 percent free space
            runbook_url: https://github.com/grvtech1/merchant-platform/blob/main/docs/runbooks/persistent-storage.md
