name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: merchant_platform
          MYSQL_USER: merchant_app
          MYSQL_PASSWORD: local-only-password
          MYSQL_ROOT_PASSWORD: local-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-root-password --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      NODE_ENV: development
      API_PORT: "8080"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: merchant_platform
      MYSQL_USER: merchant_app
      MYSQL_PASSWORD: local-only-password
      MYSQL_ROOT_PASSWORD: local-root-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      PLATFORM_API_KEY: local-platform-api-key-change-me
      ACTOR_TOKEN_SECRET: local-actor-token-secret-change-me-32-chars
      PAYMENT_PROVIDER: sandboxpay
      PAYMENT_WEBHOOK_SECRET: local-payment-webhook-secret-change-me-32-chars
      PAYMENT_WEBHOOK_TOLERANCE_SECONDS: "300"
      NOTIFICATION_PROVIDER: log
      RELEASE_VERSION: ${{ github.sha }}
      API_INTERNAL_URL: http://127.0.0.1:8080
      ALERT_WEBHOOK_TOKEN: local-alert-webhook-token-change-me
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: |
          test -f package-lock.json || { echo 'Generate and commit package-lock.json before merging.' >&2; exit 1; }
          npm ci
      - name: Reject high-severity runtime advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Test and build
        run: npm test && npm run build
      - name: Apply schema and local seed
        env:
          MYSQL_USER: root
          MYSQL_PASSWORD: local-root-password
        run: node scripts/migrate.mjs
      - name: Seed local merchant hierarchy
        run: node scripts/seed-local.mjs
      - name: Verify safe tenant provisioning
        env:
          PROVISIONING_CHANGE_ID: CI-${{ github.run_id }}
          ROOT_MERCHANT_ID: 44444444-4444-4444-8444-444444444444
          ROOT_MERCHANT_NAME: CI Provisioned Merchant
          STORE_ID: 55555555-5555-4555-8555-555555555555
          STORE_CODE: CI-STORE
          STORE_NAME: CI Provisioned Store
          STORE_TIMEZONE: Asia/Kolkata
        run: |
          first="$(node scripts/provision-tenant.mjs)"
          grep -q '"message":"tenant_provisioned"' <<< "$first"
          second="$(node scripts/provision-tenant.mjs)"
          grep -q '"message":"tenant_provisioning_noop"' <<< "$second"
          if ROOT_MERCHANT_NAME='Unexpected Rename' node scripts/provision-tenant.mjs; then
            echo 'Provisioner accepted metadata drift.' >&2
            exit 1
          fi
      - name: Start application processes
        run: |
          npm run start -w @merchant-platform/api > /tmp/api.log 2>&1 &
          npm run start -w @merchant-platform/worker > /tmp/worker.log 2>&1 &
          npm run start -w @merchant-platform/portal > /tmp/portal.log 2>&1 &
      - name: Wait for services
        run: |
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:8080/health/ready >/dev/null && \
            curl -fsS http://127.0.0.1:9091/health/ready >/dev/null && \
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/api.log /tmp/worker.log /tmp/portal.log >&2
          exit 1
      - name: Exercise the business path
        run: bash scripts/smoke-test.sh
      - name: Upload process logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-process-logs
          path: /tmp/*.log

  delivery-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - uses: azure/setup-kubectl@v5
        with: { version: v1.36.2 }
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Install validation tools
        run: python -m pip install ansible-core==2.19.4 ansible-lint==25.9.2
      - name: Validate repository contracts
        run: node scripts/validate-repository.mjs
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize deploy/k8s/overlays/local > /tmp/local.yaml
          kubectl kustomize deploy/k8s/overlays/production > /tmp/production.yaml
          grep -q 'kind: Deployment' /tmp/local.yaml
          grep -q 'sha256:REPLACE_API_DIGEST' /tmp/production.yaml
      - name: Validate Terraform
        working-directory: infra/terraform/aws
        run: terraform fmt -check -recursive && terraform init -backend=false && terraform validate
      - name: Validate Ansible
        working-directory: infra/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          cp inventory.ini.example inventory.ini
          ansible-lint site.yml
          ansible-playbook --syntax-check site.yml

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: api, image: merchant-platform-api }
          - { target: worker, image: merchant-platform-worker }
          - { target: portal, image: merchant-platform-portal }
          - { target: migration, image: merchant-platform-migration }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
      - name: Verify non-root runtime
        run: docker run --rm --entrypoint /bin/sh ${{ matrix.image }}:${{ github.sha }} -c 'test "$(id -u)" != "0"'
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          version: v0.72.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          version: v0.72.0
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
